name: Scientific validation
description: Report a method-dependent discrepancy, unstable event, or validation case.
title: "[Validation]: "
labels: [scientific-validation, triage]
body:
  - type: markdown
    attributes:
      value: >-
        This form is for scientific behavior, not sensitive security reports. Share only
        data and tool output you are authorized to redistribute.
  - type: textarea
    id: claim
    attributes:
      label: Observation or disputed claim
      description: State the machine-readable event and the interpretation separately.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Calculation and analysis provenance
      description: >-
        Include code/tool versions, functional, potentials, cutoffs, k-points, grids,
        spin/charge, path spacing, plugin settings, and ElecTrace revision.
    validations:
      required: true
  - type: textarea
    id: convergence
    attributes:
      label: Convergence and sensitivity checks
      description: Describe grid, image-density, electronic, threshold, and matching tests.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting, negative, and conflicting evidence
      description: Include all relevant descriptors and warnings, not only supporting ones.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Redistributable reproduction
      description: Link or describe the smallest authorized fixture and its SHA-256 digest.
  - type: checkboxes
    id: terms
    attributes:
      label: Data confirmation
      options:
        - label: I am authorized to share every attached input and output.
          required: true
