name: Feature proposal
description: Propose a scoped software, format, adapter, or documentation improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow or research question is currently blocked?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, failure behavior, and the smallest useful scope.
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Likely scope
      options:
        - ElecTrace 0.1 ordered VASP path
        - ElecTrace 0.2 electronic-feature lineage
        - ElecTrace 1.0 sparse trajectories
        - Documentation or project infrastructure
    validations:
      required: true
  - type: textarea
    id: science
    attributes:
      label: Scientific assumptions and alternatives
      description: Identify method dependence, related tools, and simpler alternatives.
  - type: textarea
    id: compatibility
    attributes:
      label: Reproducibility and compatibility
      description: Note schema, CLI, configuration, licensing, data, and migration concerns.
  - type: checkboxes
    id: terms
    attributes:
      label: Scope confirmation
      options:
        - label: I have separated implemented needs from speculative scientific claims.
          required: true
