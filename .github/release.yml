changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Scientific features
      labels: [scientific-feature]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation and maintenance
      labels: [documentation, dependencies]
    - title: Other changes
      labels: ["*"]
