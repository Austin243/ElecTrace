site_name: ElecTrace
site_description: Persistent electronic topology across periodic structure sequences
site_url: https://Austin243.github.io/ElecTrace/
repo_url: https://github.com/Austin243/ElecTrace
repo_name: Austin243/ElecTrace
strict: true
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
  palette:
    scheme: slate
    primary: teal
    accent: cyan
nav:
  - Overview: index.md
  - Using ElecTrace: workflows.md
  - Coding agents: agents.md
  - Scientific scope: scientific-scope.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
